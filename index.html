<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bostom Bar — Mezcal Masterclass</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
:root{--gold:#C8A86E;--gold-light:#E8D5A8;--dark:#1A1611;--dark-card:#241F18;--dark-surface:#2E2720;--warm-brown:#3D3228;--cream:#F5EDE0;--cream-muted:#BFB39E;--amber:#D4873E;--smoke:#8B7D6B;--green:#7A9B6D}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--cream);line-height:1.7;overflow-x:hidden}
/* NAV */
nav{position:fixed;top:0;width:100%;z-index:100;background:rgba(26,22,17,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(200,168,110,.15);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:64px}
.nav-brand img{height:32px}
.nav-links{display:flex;gap:1.2rem;align-items:center}
.nav-link{background:none;border:none;color:var(--cream-muted);font-family:'Inter',sans-serif;font-size:.85rem;cursor:pointer;transition:color .2s;padding:.3rem 0;border-bottom:2px solid transparent}
.nav-link:hover,.nav-link.active{color:var(--gold);border-bottom-color:var(--gold)}
.nav-link .check{color:var(--green);margin-left:.3rem;font-size:.75rem}
.lang-switcher{display:flex;gap:.4rem;flex-wrap:wrap}
.lang-btn{background:transparent;border:1px solid var(--smoke);color:var(--cream-muted);padding:.35rem .7rem;border-radius:5px;font-size:.78rem;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:.35rem}
.lang-btn.active,.lang-btn:hover{background:var(--gold);color:var(--dark);border-color:var(--gold)}
/* HERO */
.hero{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8rem 2rem 4rem;background:linear-gradient(180deg,var(--dark) 0%,rgba(61,50,40,.6) 50%,var(--dark) 100%);position:relative}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(200,168,110,.08) 0%,transparent 70%)}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2.4rem,6vw,4.2rem);font-weight:700;color:var(--gold);position:relative;margin-bottom:.5rem;letter-spacing:1px}
.hero .subtitle{font-size:clamp(1rem,2.5vw,1.3rem);color:var(--cream-muted);max-width:600px;position:relative;margin-bottom:2rem}
.hero .cta{display:inline-block;padding:.85rem 2.4rem;background:var(--gold);color:var(--dark);font-weight:600;border-radius:6px;text-decoration:none;font-size:1rem;transition:all .25s;position:relative;letter-spacing:.5px;cursor:pointer;border:none;font-family:'Inter',sans-serif}
.hero .cta:hover{background:var(--gold-light);transform:translateY(-2px)}
/* PROGRESS BAR */
.progress-bar{background:var(--dark-card);border-bottom:1px solid rgba(200,168,110,.1);padding:1rem 2rem;display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap;position:sticky;top:64px;z-index:90}
.progress-label{font-size:.8rem;color:var(--smoke);font-weight:500}
.progress-dots{display:flex;gap:.6rem}
.pdot{width:36px;height:36px;border-radius:50%;border:2px solid var(--smoke);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;color:var(--smoke);cursor:pointer;transition:all .3s;background:transparent}
.pdot.completed{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.pdot.active{border-color:var(--gold);color:var(--gold)}
.progress-text{font-size:.8rem;color:var(--cream-muted)}
/* MODULE */
.module-section{max-width:900px;margin:0 auto;padding:1rem 2rem}
.module-accordion{border-top:1px solid rgba(200,168,110,.08);padding:1rem 0}
.module-header{display:flex;align-items:center;gap:1rem;cursor:pointer;padding:1.2rem 0;user-select:none}
.module-header:hover .module-title{color:var(--gold)}
.module-number{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--gold);line-height:1;min-width:50px}
.module-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:600;color:var(--cream);transition:color .2s;flex:1}
.module-toggle{font-size:1.5rem;color:var(--gold);transition:transform .3s;min-width:30px;text-align:center}
.module-toggle.open{transform:rotate(180deg)}
.module-body{overflow:hidden;transition:max-height .4s ease,opacity .3s ease;max-height:0;opacity:0}
.module-body.open{max-height:5000px;opacity:1}
.module-content{padding:0 0 2rem}
.module-img{width:100%;max-height:360px;object-fit:cover;border-radius:10px;margin:1.5rem 0;box-shadow:0 4px 20px rgba(0,0,0,.3);border:1px solid rgba(200,168,110,.08)}
.module-content h3{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gold-light);margin:1.8rem 0 .6rem}
.module-content p{color:var(--cream-muted);margin-bottom:1rem;font-size:.95rem}
.module-content strong{color:var(--cream)}
.takeaways{background:var(--dark-surface);border-left:3px solid var(--gold);padding:1rem 1.5rem;border-radius:0 8px 8px 0;margin-top:2rem}
.takeaways-title{font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin-bottom:.5rem;font-weight:600}
.takeaways ul{list-style:none;padding:0}
.takeaways li{padding:.25rem 0;color:var(--cream-muted);font-size:.95rem}
.takeaways li::before{content:'◆ ';color:var(--gold);font-size:.6rem;vertical-align:middle;margin-right:.4rem}
/* REFERENCES */
.references{max-width:900px;margin:0 auto;padding:3rem 2rem 2rem;border-top:1px solid rgba(200,168,110,.08)}
.references h2{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold);margin-bottom:1rem}
.references ol{padding-left:1.2rem}
.references li{color:var(--cream-muted);font-size:.85rem;margin-bottom:.5rem}
.references a{color:var(--gold);text-decoration:none}
.references a:hover{text-decoration:underline}
/* FOOTER */
footer{text-align:center;padding:3rem 2rem;border-top:1px solid rgba(200,168,110,.1);background:var(--dark-card)}
.footer-brand img{height:36px;margin-bottom:.8rem}
footer p{color:var(--smoke);font-size:.8rem}
footer a{color:var(--gold);text-decoration:none}
footer a:hover{text-decoration:underline}
/* RESPONSIVE */
@media(max-width:768px){
  nav{padding:0 1rem;flex-wrap:wrap;height:auto;padding:.6rem 1rem}
  .nav-links{display:none}
  .module-section{padding:1rem 1.2rem}
  .module-title{font-size:1.2rem}
  .lang-switcher{gap:.25rem}
  .lang-btn{font-size:.7rem;padding:.25rem .5rem}
}
</style>
</head>

const langFlags = { en: '🇬🇧', es: '🇪🇸', ja: '🇯🇵', zh: '🇨🇳' };

// ═══════════════════════════════════════════
// APP COMPONENT
// ═══════════════════════════════════════════
function App() {
  const [lang, setLang] = React.useState('en');
  const [openModules, setOpenModules] = React.useState(new Set());
  const [visited, setVisited] = React.useState(new Set());

  const t = translations[lang];

  const toggleModule = (id) => {
    setOpenModules(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
    setVisited(prev => { const next = new Set(prev); next.add(id); return next; });
  };

  const scrollTo = (id) => {
    document.getElementById('module-' + id)?.scrollIntoView({ behavior: 'smooth' });
    if (!openModules.has(id)) toggleModule(id);
  };

  const completedCount = visited.size;

  return (
    <React.Fragment>
      {/* NAV */}
      <nav>
        <div className="nav-brand"><img src="logo.jpg" alt="Bostom Bar" /></div>
        <div className="nav-links">
          {moduleData.map(m => (
            <button key={m.id} className={'nav-link' + (openModules.has(m.id) ? ' active' : '')} onClick={() => scrollTo(m.id)}>
              {t[m.prefix + '_title']}
              {visited.has(m.id) && <span className="check">✓</span>}
            </button>
          ))}
        </div>
        <div className="lang-switcher">
          {Object.keys(translations).map(code => (
            <button key={code} className={'lang-btn' + (lang === code ? ' active' : '')} onClick={() => setLang(code)}>
              {langFlags[code]} {translations[code].lang_name}
            </button>
          ))}
        </div>
      </nav>

      {/* HERO */}
      <section className="hero">
        <h1>{t.hero_title}</h1>
        <p className="subtitle">{t.hero_sub}</p>
        <button className="cta" onClick={() => scrollTo(1)}>{t.hero_cta}</button>
      </section>

      {/* PROGRESS */}
      <div className="progress-bar">
        <span className="progress-label">{t.progress}</span>
        <div className="progress-dots">
          {moduleData.map(m => (
            <div key={m.id}
              className={'pdot' + (visited.has(m.id) ? ' completed' : '') + (!visited.has(m.id) && m.id === (moduleData.find(x => !visited.has(x.id))?.id) ? ' active' : '')}
              onClick={() => scrollTo(m.id)}>{visited.has(m.id) ? '✓' : m.id}</div>
          ))}
        </div>
        <span className="progress-text">{completedCount} {t.completed_of}</span>
      </div>

      {/* MODULES */}
      <div className="module-section">
        {moduleData.map((m, idx) => {
          const p = m.prefix;
          const isOpen = openModules.has(m.id);
          return (
            <div key={m.id} className="module-accordion" id={'module-' + m.id}>
              <div className="module-header" onClick={() => toggleModule(m.id)}>
                <span className="module-number">{'0' + m.id}</span>
                <div>
                  <div className="module-title">{t[p + '_title']}</div>
                  <div style={{color:'var(--cream-muted)',fontSize:'.9rem',marginTop:'.2rem'}}>{t[p + '_desc']}</div>
                </div>
                <span className={'module-toggle' + (isOpen ? ' open' : '')}>▾</span>
              </div>
              <div className={'module-body' + (isOpen ? ' open' : '')}>
                <div className="module-content">
                  {m.images[0] && <img className="module-img" src={m.images[0]} alt="" loading="lazy" />}
                  <h3>{t[p + '_h1']}</h3>
                  <p dangerouslySetInnerHTML={{__html: t[p + '_p1']}} />
                  <h3>{t[p + '_h2']}</h3>
                  <p dangerouslySetInnerHTML={{__html: t[p + '_p2']}} />
                  {m.images[1] && <img className="module-img" src={m.images[1]} alt="" loading="lazy" />}
                  <h3>{t[p + '_h3']}</h3>
                  <p dangerouslySetInnerHTML={{__html: t[p + '_p3']}} />
                  {m.images[2] && <img className="module-img" src={m.images[2]} alt="" loading="lazy" />}
                  <div className="takeaways">
                    <div className="takeaways-title">{t.takeaways}</div>
                    <ul>
                      <li>{t[p + '_t1']}</li>
                      <li>{t[p + '_t2']}</li>
                      <li>{t[p + '_t3']}</li>
                      <li>{t[p + '_t4']}</li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* REFERENCES */}
      <section className="references">
        <h2>{t.ref_title}</h2>
        <ol>
          <li>Fuego y Humo — <em>Advanced Guide to Drinking Mezcal</em>. <a href="https://fuegoyhumo.com/blogs/education/advanced-guide-to-drinking-mezcal" target="_blank" rel="noreferrer">fuegoyhumo.com</a></li>
          <li>Bostom Bar — Business Profile &amp; Branding.</li>
          <li>Mezcalistas — <em>Ultimate Mezcal 101 Guide</em>. <a href="https://www.mezcalistas.com/mezcal-101/" target="_blank" rel="noreferrer">mezcalistas.com</a></li>
        </ol>
      </section>

      {/* FOOTER */}
      <footer>
        <div className="footer-brand"><img src="logo.jpg" alt="Bostom Bar" /></div>
        <p>{t.footer_text}</p>
        <p style={{marginTop:'1.5rem',fontSize:'.7rem',color:'var(--smoke)'}}>{t.footer_copy}</p>
      </footer>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
