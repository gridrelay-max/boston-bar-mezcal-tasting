:root{--gold:#C8A86E;--gold-light:#E8D5A8;--dark:#1A1611;--dark-card:#241F18;--dark-surface:#2E2720;--warm-brown:#3D3228;--cream:#F5EDE0;--cream-muted:#BFB39E;--amber:#D4873E;--smoke:#8B7D6B;--green:#7A9B6D}

body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--cream);line-height:1.7;overflow-x:hidden}

.lang-b.on,.lang-b:hover{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.hero{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8rem 2rem 4rem;background:linear-gradient(180deg,var(--dark) 0%,rgba(61,50,40,.55) 50%,var(--dark) 100%);position:relative}

.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2.4rem,6vw,4.2rem);font-weight:700;color:var(--gold);position:relative;margin-bottom:.5rem}

.hero .cta:hover{background:var(--gold-light);transform:translateY(-2px)}
.pbar{background:var(--dark-card);border-bottom:1px solid rgba(200,168,110,.1);padding:1rem 2rem;display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap;position:sticky;top:64px;z-index:90}
.plbl{font-size:.8rem;color:var(--smoke);font-weight:500}
.pdots{display:flex;gap:.6rem}
.pdot{width:36px;height:36px;border-radius:50%;border:2px solid var(--smoke);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;color:var(--smoke);cursor:pointer;transition:all .3s;background:transparent}
.pdot.done{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.pdot.cur{border-color:var(--gold);color:var(--gold)}
.ptxt{font-size:.8rem;color:var(--cream-muted)}
.mods{max-width:900px;margin:0 auto;padding:1rem 2rem}
.macc{border-top:1px solid rgba(200,168,110,.08);padding:1rem 0}
.mhdr{display:flex;align-items:center;gap:1rem;cursor:pointer;padding:1.2rem 0;user-select:none}
.mhdr:hover .mtitle{color:var(--gold)}
.mnum{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--gold);line-height:1;min-width:50px}
.mtitle{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:600;color:var(--cream);transition:color .2s}
.mdesc{color:var(--cream-muted);font-size:.9rem;margin-top:.2rem}
.mtog{font-size:1.5rem;color:var(--gold);transition:transform .3s;min-width:30px;text-align:center}
.mtog.open{transform:rotate(180deg)}
.mbody{overflow:hidden;max-height:0;opacity:0;transition:max-height .5s ease,opacity .4s ease}
.mbody.open{max-height:8000px;opacity:1}
.mcont{padding:0 0 2rem}
.mimg{width:100%;max-height:380px;object-fit:cover;border-radius:10px;margin:1.5rem 0;box-shadow:0 4px 24px rgba(0,0,0,.35);border:1px solid rgba(200,168,110,.08)}
.mcont h3{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gold-light);margin:1.8rem 0 .6rem}

.mcont strong{color:var(--cream)}
.tkwy{background:var(--dark-surface);border-left:3px solid var(--gold);padding:1rem 1.5rem;border-radius:0 8px 8px 0;margin-top:2rem}
.tkwy-t{font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin-bottom:.5rem;font-weight:600}
.tkwy ul{list-style:none;padding:0}
.tkwy li{padding:.25rem 0;color:var(--cream-muted);font-size:.95rem}
.tkwy li::before{content:'\25C6 ';color:var(--gold);font-size:.6rem;vertical-align:middle;margin-right:.4rem}

footer{text-align:center;padding:3rem 2rem;border-top:1px solid rgba(200,168,110,.1);background:var(--dark-card)}
.fbrand img{height:36px;margin-bottom:.8rem}
footer p{color:var(--smoke);font-size:.8rem}
footer a{color:var(--gold);text-decoration:none}

</style>

  ln:"English",hero_title:"Mezcal Masterclass",hero_sub:"Explore the world of mezcal \u2014 from origins to serving \u2014 in 4 immersive modules.",hero_cta:"Start Learning",progress:"Progress",cof:"of 4 completed",tkwy:"Key Takeaways",ref:"References",ftxt:"A premium mezcal experience. Sip it, don\u2019t shoot it.",fcopy:"\u00a9 2026 Bostom Bar. All rights reserved.",
  m1t:"What is Mezcal?",m1d:"Origins, production, agave types, and what makes this spirit extraordinary.",
  m1h1:"The Spirit of Mexico",m1p1:'The word mezcal comes from the Nahuatl <strong>mexcalli</strong>, meaning \u201ccooked agave.\u201d Colloquially, mezcal means any spirit distilled from the agave plant. People have been making mezcal in Mexico since at least the Spanish conquest, potentially earlier. Like wine, mezcal is traditionally a broad term \u2014 but legally, it can only be labeled as mezcal in ten Mexican states under the Denominaci\u00f3n de Origen.',
  m1h2:"Where is Mezcal Made?",m1p2:"While agave spirits are produced throughout Mexico, mezcal can only be legally certified in <strong>Oaxaca, Michoac\u00e1n, Puebla, Guerrero, Zacatecas, Guanajuato, Tamaulipas, San Luis Potos\u00ed, Durango, and Sinaloa</strong>. Oaxaca produces around 80% of the mezcal available on the international market.",
  m1h3:"The Agave \u2014 A Singular Plant",m1p3:"No other spirit shares mezcal\u2019s base ingredient. Agave takes a <strong>minimum of 4 years to mature</strong>, usually 8\u201310 years. Once harvested, the plant dies \u2014 you must start over. Around 40 types of agave are used to make mezcal, with <strong>espad\u00edn</strong> being the most common.",
  m1k1:"Mezcal means \u2018cooked agave\u2019 in Nahuatl",m1k2:"Legally certified in 10 Mexican states; Oaxaca produces ~80%",m1k3:"Agave takes 4\u201310 years to mature and dies after harvest",m1k4:"Around 40 agave species are used in production",
  m2t:"How Mezcal is Made",m2d:"From harvest to distillation \u2014 the traditional craft behind every bottle.",
  m2h1:"Harvesting the Agave",m2p1:"After an agave reaches maturity, its <strong>pencas</strong> (leaves) are removed to expose the <strong>pi\u00f1a</strong> (heart). These trimmed agaves are transported to the distillery \u2014 called a <strong>palenque</strong> in Oaxaca, or <strong>vinata</strong> or <strong>taberna</strong> in other regions.",
  m2h2:"Roasting",m2p2:"The most traditional method uses an <strong>earthen pit oven</strong>, lined with rock, fired by wood, then sealed with leaves and dirt for a slow roast. Some producers use brick ovens. Industrial distilleries may use stainless steel autoclaves. The roasting method is a major contributor to mezcal\u2019s characteristic smoky flavor.",
  m2h3:"Crushing, Fermentation & Distillation",m2p3:"Roasted agave is crushed by hand with mallets, by a <strong>tahona</strong> (stone wheel), or by mechanical shredder. The fiber goes into open-air fermentation tanks where <strong>wild yeast</strong> kick-starts fermentation over 3\u20137 days. Finally, the mash is distilled in copper, clay, wood, or steel stills. Mezcal has a high level of congeners, which explains its elevated complexity of aromas and flavors.",
  m2k1:"Agave hearts (pi\u00f1as) are roasted in earthen pit ovens for smoky flavor",m2k2:"Wild yeast from open-air fermentation creates complex flavors",m2k3:"Distillation in copper, clay, or wood stills preserves character",m2k4:"The entire process is deeply rooted in centuries-old tradition",
  m3t:"Mezcal vs. Tequila",m3d:"Key differences in agave, process, regulation, and culture.",
  m3h1:"Tequila: A Type of Mezcal",m3p1:"Tequila is technically a type of mezcal \u2014 made specifically in the Tequila region of Jalisco since the 1600s. Today, tequila can only be made from <strong>blue agave (Agave tequilana weber)</strong>, in parts of five Mexican states, using specific regulated methods.",
  m3h2:"Production Differences",m3p2:'While mezcal agave is typically cooked in pits or wood-fired ovens, tequila agave may be roasted in brick ovens, steamed in autoclaves, or processed through <strong>diffusors</strong>. All certified mezcal is 100% agave, while tequila has a \u201cmixto\u201d category \u2014 only 51% agave sugar, supplemented by other sugars including corn syrup.',
  m3h3:"Aging & Categories",m3p3:"Barrel aging is common in tequila (blanco, gold, reposado, a\u00f1ejo, extra a\u00f1ejo) but rare in traditional mezcal. Mezcal categories focus on <strong>production method</strong> (mezcal, mezcal artesanal, mezcal ancestral). Related spirits with their own DOs include <strong>raicilla</strong>, <strong>bacanora</strong>, and <strong>sotol</strong>.",
  m3k1:"Tequila is a type of mezcal, but not all mezcal is tequila",m3k2:"Tequila uses only blue agave; mezcal uses ~40 species",m3k3:'All certified mezcal is 100% agave \u2014 tequila has a \u201cmixto\u201d category',m3k4:"Mezcal categorizes by production method, not barrel aging",
  m4t:"Tasting & Enjoying Mezcal",m4d:"How to sip, what to look for, and why mezcal is worth savoring.",
  m4h1:"The Vessel & Pour",m4p1:'Pour about 1 oz neat into a traditional <strong>veladora</strong> (wide-mouthed glass) or a Glencairn whiskey glass. Watch for <strong>perlas</strong> (bubbles) \u2014 mezcaleros use them to gauge ABV. Let it breathe for a few minutes before sipping.',
  m4h2:"The Besos Technique",m4p2:'<strong>Besos</strong> means \u201ckisses.\u201d Sip the mezcal gently into the front of your mouth first, then \u201cchew\u201d it back over your tongue. Pay attention to the <strong>front</strong> (first impression), <strong>middle</strong> (palate development), and <strong>finish</strong> (lingering flavors). Is it creamy, bright, smoky, floral, earthy?',
  m4h3:"Finding Good Mezcal",m4p3:"Find a local mezcal bar and order a flight \u2014 ask for quarter-ounce pours since mezcal runs 45\u201350% ABV. Look for 100% agave on the label, and remember: <strong>the best mezcal won\u2019t overpower you with smoke</strong>.",
  m4k1:"Use a veladora or Glencairn glass; watch for perlas",m4k2:'Use \u201cbesos\u201d \u2014 sip to the front of the mouth, then chew back',m4k3:"Order flights at mezcal bars for easy comparison",m4k4:"Great mezcal is complex and balanced, not just smoky"
},

  m4h2:"Besos\u6280\u5de7",m4p2:'<strong>Besos</strong>\u610f\u4e3a\u201c\u4eb2\u543b\u201d\u3002\u8f7b\u8f7b\u542b\u5165\u53e3\u8154\u524d\u90e8\uff0c\u7136\u540e\u5728\u820c\u5934\u4e0a\u201c\u54c0\u56bc\u201d\u3002\u6ce8\u610f<strong>\u524d\u8c03</strong>\u3001<strong>\u4e2d\u8c03</strong>\u3001<strong>\u4f59\u5473</strong>\u3002',
  m4h3:"\u5bfb\u627e\u597d\u7684\u6885\u65af\u5361\u5c14",m4p3:"\u5728\u6885\u65af\u5361\u5c14\u9152\u5427\u70b9\u54c1\u9274\u7ec4\u540845-50% ABV\u3002\u770b100%\u9f99\u820c\u5170\u3002<strong>\u6700\u597d\u7684\u6885\u65af\u5361\u5c14\u4e0d\u4f1a\u7528\u70df\u718f\u538b\u5012\u4f60</strong>\u3002",
  m4k1:"\u4f7f\u7528veladora\u6216Glencairn",m4k2:"\u7528besos\u542b\u5165\u53e3\u8154\u524d\u90e8",m4k3:"\u70b9\u54c1\u9274\u7ec4\u5408\u4ee5\u4fbf\u6bd4\u8f83",m4k4:"\u4f18\u79c0\u6885\u65af\u5361\u5c14\u590d\u6742\u5e73\u8861"
}
};

// MODULE IMAGES
var MODS = [
  {id:1,pfx:'m1',imgs:['https://www.mezcalistas.com/wp-content/uploads/2015/11/IMG_6903-683x1024.jpg','https://www.mezcalistas.com/wp-content/uploads/2020/06/1-7-768x768.jpg']},
  {id:2,pfx:'m2',imgs:['https://www.mezcalistas.com/wp-content/uploads/2020/06/1-18-1024x768.jpg','https://www.mezcalistas.com/wp-content/uploads/2019/03/fermentation-tanks-apaluz.jpg','https://www.mezcalistas.com/wp-content/uploads/2023/04/571f7904-a7a8-4994-8033-e12450e442bf-768x432.jpg']},
  {id:3,pfx:'m3',imgs:['https://www.mezcalistas.com/wp-content/uploads/2020/06/1-1.jpg','https://www.mezcalistas.com/wp-content/uploads/2020/10/2-27.jpg']},
  {id:4,pfx:'m4',imgs:['https://www.mezcalistas.com/wp-content/uploads/2019/12/La-Luna-Mezcal-7-1024x768.jpg','https://www.mezcalistas.com/wp-content/uploads/2013/04/IMG_0509-768x512.jpg']}
];

var FLAGS = {en:'\ud83c\uddec\ud83c\udde7',es:'\ud83c\uddea\ud83c\uddf8',ja:'\ud83c\uddef\ud83c\uddf5',zh:'\ud83c\udde8\ud83c\uddf3'};
var LANGS = ['en','es','ja','zh'];

// ═══════════════════════════════════════
// REACT APP (createElement only, no JSX)
// ═══════════════════════════════════════
function App() {
  var _lang = React.useState('en'), lang = _lang[0], setLang = _lang[1];
  var _open = React.useState({}), openM = _open[0], setOpenM = _open[1];
  var _vis = React.useState({}), visited = _vis[0], setVisited = _vis[1];
  var t = T[lang];

  function toggle(id) {
    setOpenM(function(p){var n=Object.assign({},p);n[id]=!n[id];return n;});
    setVisited(function(p){var n=Object.assign({},p);n[id]=true;return n;});
  }
  function scrollTo(id) {
    var el = document.getElementById('mod-'+id);
    if(el) el.scrollIntoView({behavior:'smooth'});
    if(!openM[id]) toggle(id);
  }
  var count = Object.keys(visited).length;
  var firstUnvisited = MODS.find(function(m){return !visited[m.id]});

  // NAV
  var nav = h('nav',null,
    h('div',{className:'nav-brand'},h('img',{src:'logo.jpg',alt:'Bostom Bar'})),
    h('div',{className:'nav-links'},
      MODS.map(function(m){
        return h('button',{key:m.id,className:'nav-link'+(openM[m.id]?' active':''),onClick:function(){scrollTo(m.id);}},
          t[m.pfx+'t'],
          visited[m.id]?h('span',{className:'nav-check'},'\u2713'):null
        );
      })
    ),
    h('div',{className:'lang-sw'},
      LANGS.map(function(code){
        return h('button',{key:code,className:'lang-b'+(lang===code?' on':''),onClick:function(){setLang(code);}},
          FLAGS[code],' ',T[code].ln
        );
      })
    )
  );

  // HERO
  var hero = h('section',{className:'hero'},
    h('h1',null,t.hero_title),
    h('p',{className:'sub'},t.hero_sub),
    h('button',{className:'cta',onClick:function(){scrollTo(1);}},t.hero_cta)
  );

  // PROGRESS
  var pbar = h('div',{className:'pbar'},
    h('span',{className:'plbl'},t.progress),
    h('div',{className:'pdots'},
      MODS.map(function(m){
        var cls = 'pdot';
        if(visited[m.id]) cls += ' done';
        else if(firstUnvisited && m.id === firstUnvisited.id) cls += ' cur';
        return h('div',{key:m.id,className:cls,onClick:function(){scrollTo(m.id);}},
          visited[m.id]?'\u2713':m.id
        );
      })
    ),
    h('span',{className:'ptxt'},count+' '+t.cof)
  );

  // MODULES
  var modules = h('div',{className:'mods'},
    MODS.map(function(m){
      var p = m.pfx;
      var isOpen = !!openM[m.id];
      return h('div',{key:m.id,className:'macc',id:'mod-'+m.id},
        h('div',{className:'mhdr',onClick:function(){toggle(m.id);}},
          h('span',{className:'mnum'},'0'+m.id),
          h('div',{style:{flex:1}},
            h('div',{className:'mtitle'},t[p+'t']),
            h('div',{className:'mdesc'},t[p+'d'])
          ),
          h('span',{className:'mtog'+(isOpen?' open':'')},'\u25be')
        ),
        h('div',{className:'mbody'+(isOpen?' open':'')},
          h('div',{className:'mcont'},
            m.imgs[0]?h('img',{className:'mimg',src:m.imgs[0],alt:'',loading:'lazy'}):null,
            h('h3',null,t[p+'h1']),
            h('p',{dangerouslySetInnerHTML:{__html:t[p+'p1']}}),
            h('h3',null,t[p+'h2']),
            h('p',{dangerouslySetInnerHTML:{__html:t[p+'p2']}}),
            m.imgs[1]?h('img',{className:'mimg',src:m.imgs[1],alt:'',loading:'lazy'}):null,
            h('h3',null,t[p+'h3']),
            h('p',{dangerouslySetInnerHTML:{__html:t[p+'p3']}}),
            m.imgs[2]?h('img',{className:'mimg',src:m.imgs[2],alt:'',loading:'lazy'}):null,
            h('div',{className:'tkwy'},
              h('div',{className:'tkwy-t'},t.tkwy),
              h('ul',null,
                h('li',null,t[p+'k1']),
                h('li',null,t[p+'k2']),
                h('li',null,t[p+'k3']),
                h('li',null,t[p+'k4'])
              )
            )
          )
        )
      );
    })
  );

  var refs = null;

  // FOOTER
  var foot = h('footer',null,
    h('div',{className:'fbrand'},h('img',{src:'logo.jpg',alt:'Bostom Bar'})),
    h('p',null,t.ftxt),
    h('p',{style:{marginTop:'1.5rem',fontSize:'.7rem',color:'var(--smoke)'}},t.fcopy)
  );

  return h(React.Fragment,null,nav,hero,pbar,modules,refs,foot);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
